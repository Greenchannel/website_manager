name: build-windows

# 打 tag（v1.0.0 这种）→ 自动编译并挂到 Release；平时 push → 只上传 artifact
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 MinGW-w64（posix 线程版）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-mingw-w64-x86-64
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: 编译（静态链接，产出单文件 exe）
        run: |
          mkdir -p dist
          x86_64-w64-mingw32-g++-posix -std=c++23 -O2 -I. \
            -static -static-libgcc -static-libstdc++ \
            -o dist/webm.exe webm.cpp

      - name: 检查有没有漏掉的运行时 DLL 依赖
        run: |
          x86_64-w64-mingw32-objdump -p dist/webm.exe | grep "DLL Name"
          echo "↑ 只允许出现 KERNEL32.dll / msvcrt.dll 之类的系统库"

      - name: 打包
        run: |
          cp 使用说明.txt dist/ 2>/dev/null || true
          cd dist && python3 -c "import zipfile,os;z=zipfile.ZipFile('../webm-windows-x64.zip','w',zipfile.ZIP_DEFLATED);[z.write(f,f) for f in os.listdir('.')]"

      - uses: actions/upload-artifact@v4
        with:
          name: webm-windows-x64
          path: webm-windows-x64.zip

      - name: 打 tag 时自动发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: webm-windows-x64.zip
