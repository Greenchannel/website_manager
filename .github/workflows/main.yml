name: build

# 打 tag（v1.0.0 这种）→ 编译三个平台并挂到 Release；平时 push → 只上传 artifact
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 MinGW-w64（posix 线程版）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-mingw-w64-x86-64
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: 编译（静态链接，产出单文件 exe）
        run: |
          mkdir -p dist
          x86_64-w64-mingw32-g++-posix -std=c++23 -O2 -I. \
            -static -static-libgcc -static-libstdc++ \
            -o dist/webm.exe webm.cpp

      - name: 检查有没有漏掉的运行时 DLL 依赖
        run: |
          x86_64-w64-mingw32-objdump -p dist/webm.exe | grep "DLL Name"
          echo "↑ 只允许出现 KERNEL32.dll / msvcrt.dll 之类的系统库"

      - name: 打包
        run: |
          cp 使用说明.txt dist/ 2>/dev/null || true
          cd dist && python3 -c "import zipfile,os;z=zipfile.ZipFile('../webm-windows-x64.zip','w',zipfile.ZIP_DEFLATED);[z.write(f,f) for f in os.listdir('.')]"

      - uses: actions/upload-artifact@v4
        with:
          name: webm-windows-x64
          path: webm-windows-x64.zip

  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译（静态链接，不依赖 libstdc++ / glibc 版本）
        run: |
          mkdir -p dist
          g++ -std=c++23 -O2 -I. -static -s -o dist/webm webm.cpp
          ldd dist/webm 2>&1 || true

      - name: 确认是静态链接（否则老发行版会缺 GLIBCXX）
        run: |
          file dist/webm
          ldd dist/webm 2>&1 | grep -q "not a dynamic executable"

      - name: 打包
        run: |
          cp 使用说明.txt dist/ 2>/dev/null || true
          tar -czf webm-linux-x64.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: webm-linux-x64
          path: webm-linux-x64.tar.gz

  linux-arm64:
    # 原生 arm64 runner（公开仓库免费，无需交叉工具链）
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: 编译（静态链接，不依赖 libstdc++ / glibc 版本）
        run: |
          mkdir -p dist
          g++ -std=c++23 -O2 -I. -static -s -o dist/webm webm.cpp
          file dist/webm

      - name: 确认是静态链接
        run: ldd dist/webm 2>&1 | grep -q "not a dynamic executable"

      - name: 打包
        run: |
          cp 使用说明.txt dist/ 2>/dev/null || true
          tar -czf webm-linux-arm64.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: webm-linux-arm64
          path: webm-linux-arm64.tar.gz

  # 全部平台都编完后再统一发版，避免多个 job 抢着创建 Release
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-x64, linux-x64, linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成校验和
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
